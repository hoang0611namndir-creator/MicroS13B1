# ===== Thông tin ứng dụng =====
spring.application.name=product-service

# Giữ giá trị mặc định 8082 cho Instance 1 (chạy Run bình thường).
# Instance 2 sẽ override giá trị này bằng Program argument: --server.port=8084
# (hoặc -Dserver.port=8084), không cần sửa file này.
server.port=8082

# ===== Cấu hình Database =====
spring.datasource.url=jdbc:mysql://localhost:3306/product_db?createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# ===== Cấu hình Eureka Client =====
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.instance.prefer-ip-address=true
eureka.instance.lease-renewal-interval-in-seconds=10
eureka.instance.lease-expiration-duration-in-seconds=30
eureka.client.fetch-registry=true
eureka.client.register-with-eureka=true

# QUAN TRỌNG khi chạy nhiều instance cùng 1 máy: mỗi instance phải có instance-id
# riêng biệt. Mặc định Eureka ghép hostname làm id, nên 2 instance chạy trên
# cùng máy (cùng hostname) dễ bị coi là trùng nhau, đè dữ liệu lên nhau trên
# Dashboard. Ghép thêm server.port vào id để đảm bảo mỗi instance là duy nhất.
eureka.instance.instance-id=${spring.application.name}:${server.port}

# ===== Actuator =====
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always

spring.data.redis.host=localhost
spring.data.redis.port=6379

spring.cache.type=redis

