# ===== Thông tin ứng dụng =====
spring.application.name=customer-service
server.port=8081

# ===== Cấu hình Database =====
spring.datasource.url=jdbc:mysql://localhost:3306/customer_db?createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# ===== Cấu hình Eureka Client =====
# Địa chỉ của Eureka Server (Danh bạ)
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/

# Đăng ký bằng địa chỉ IP thay vì hostname (dễ debug hơn khi chạy local/docker)
eureka.instance.prefer-ip-address=true

# Tần suất gửi heartbeat lên Eureka Server (giây) - mặc định 30s, để 10s cho dễ demo
eureka.instance.lease-renewal-interval-in-seconds=10

# Thời gian Eureka Server chờ trước khi coi instance là DOWN nếu không nhận heartbeat
eureka.instance.lease-expiration-duration-in-seconds=30

# Bật fetch registry để service này cũng biết các service khác (phục vụ gọi liên service sau này)
eureka.client.fetch-registry=true
eureka.client.register-with-eureka=true

# ===== Actuator: để hiển thị đúng trạng thái UP/DOWN trên Eureka Dashboard =====
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always
